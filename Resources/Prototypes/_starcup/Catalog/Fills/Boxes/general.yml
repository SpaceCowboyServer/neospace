  - type: Sprite
    layers:
    - state: box_hug
    - state: heart
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: Envelope
          amount: 4
        - id: PaperDyedPink
          amount: 4
        - id: RubberStampHeart
          amount: 1
