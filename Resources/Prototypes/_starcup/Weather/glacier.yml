## базові налаштування, більшість часу погода має бути звичайною, переходи - рідкість
- type: weatherScheduler
  id: WeatherGlacier
  states:
    WeatherClear:
      transitions:
        WeatherClear: 162
        WeatherSnowfallLight: 1
        WeatherSnowfallHeavy: 0.05
    WeatherSnowfallLight:
      transitions:
        WeatherClear: 1
        WeatherSnowfallLight: 100
        WeatherSnowfallMedium: 2
    WeatherSnowfallMedium:
      transitions:
        WeatherSnowfallLight: 3
        WeatherSnowfallMedium: 150
        WeatherSnowfallHeavy: 1
    WeatherSnowfallHeavy:
      transitions:
        WeatherSnowfallLight: 1
        WeatherSnowfallMedium: 3
        WeatherSnowfallHeavy: 36
