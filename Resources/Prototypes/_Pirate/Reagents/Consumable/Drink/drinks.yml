# Pirate: coffemaker (keep this in sync with coffee above)
- type: reagent
  id: SyntheticCoffee
  name: reagent-name-synthetic-coffee
  parent: BaseDrink
  desc: reagent-desc-synthetic-coffee
  physicalDesc: reagent-physical-desc-aromatic
  flavor: coffee
  color: "#966405"
  recognizable: true
  metabolisms:
    Drink:
      metabolismRate: 0.05 # Goobstation: Very slow metabolism
      effects:
      - !type:SatiateThirst
        factor: 2
      - !type:ModifyStatusEffect
        effectProto: StatusEffectDrowsiness
        time: 2
        type: Remove
      - !type:AdjustReagent
        reagent: Anthrobromine
        amount: 0.05
      - !type:AdjustTemperature
        conditions:
        - !type:TemperatureCondition
          max: 293.15 # Pirate: coffeemaker - intentional Leporazine cold threshold in Kelvin
        amount: 25000 # Pirate: coffeemaker
      - !type:Jitter # Goobstation: Coffee causes jitteriness and alters speed
        conditions:
        - !type:ReagentCondition
          reagent: SyntheticCoffee
          min: 25
      - !type:MovementSpeedModifier
        walkSpeedModifier: 1.1
        sprintSpeedModifier: 1.1
        conditions:
        - !type:ReagentCondition
          reagent: SyntheticCoffee
          min: 25
          max: 99
      - !type:GenericStatusEffect
        key: Stutter
        component: StutteringAccent
        conditions:
        - !type:ReagentCondition
          reagent: SyntheticCoffee
          min: 75
      - !type:MovementSpeedModifier # Goobstation: Drinking too much causes chest pain and slows you down
        walkSpeedModifier: 0.70
        sprintSpeedModifier: 0.70
        conditions:
        - !type:ReagentCondition
          reagent: SyntheticCoffee
          min: 100
      - !type:PopupMessage
        visualType: Medium
        messages: ["ephedrine-effect-tight-pain", "ephedrine-effect-heart-pounds"]
        type: Local
        probability: 0.1
        conditions:
        - !type:ReagentCondition
          reagent: SyntheticCoffee
          min: 100
  metamorphicSprite:
    sprite: Objects/Consumable/Drinks/coffeeglass.rsi
    state: icon_empty
  metamorphicMaxFillLevels: 4
  metamorphicFillBaseName: fill-
  metamorphicChangeColor: false
# Pirate: coffemaker (end)
